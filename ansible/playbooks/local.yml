---
- hosts: local
  roles:
    # - configure/nopasswd-sudo
    - configure/makepkg
    # - configure/evoluent-verticalmouse
    - configure/nautilus
    - yubikey/tools
    - yubikey/gpg
    - yubikey/fido2
    - omarchy/terminal
    - omarchy/browser
    - omarchy/editor
    - omarchy/theme
    - omarchy/capture
    - omarchy/voxtype
    - omarchy/ai-usagebar
    - omarchy/vpn
    - role: omarchy/plugins
      omarchy_plugins:
        - { id: akitaonrails.ai-usagebar, url: 'https://github.com/akitaonrails/ai-usagebar.git' }
        - { id: quickshell.spotify, url: 'https://github.com/stappmus/Omarchy-Spotify.git' }
        - { id: jkoestinger.vpn, url: 'https://github.com/jkoestinger/omarchy-vpn.git' }
        - { id: crmne.hyprmoncfg, url: 'https://github.com/crmne/omarchy-hyprmoncfg.git', after: omarchy.audio }
        - { id: omaplug, url: 'https://github.com/fross100/omaplug.git' }
        - { id: io.github.grichard99.omaproton-vpn, url: 'https://github.com/grichard99/omaproton-vpn.git' }
      omarchy_disabled_plugins:
        - omarchy.monitor
    - runtimes/mise
    - runtimes/php
    - runtimes/rust
    - software/packages
    # - software/davmail  # not in use at the moment
    - software/tuitube
    - software/xiphos
    # - software/cliphist  # omarchy has its own clipboard history
    # - software/hyprwhspr  # voxtype does this job instead
