---
# mise itself comes with Omarchy. The tool list is not here on purpose -- it
# is home/dot_config/mise/config.toml in this repo, applied by chezmoi, so `mise
# use -g` on the CLI and the playbook cannot disagree about it.
- name: 'install mise tools'
  ansible.builtin.command: 'mise install'
  register: mise_install
  changed_when: "'installing' in (mise_install.stderr | lower)"
