---
# https://plugins.calibre-ebook.com/. The zip name is the MobileRead thread id
# and always serves the current release, so the version is not pinned.
# calibre-customize writes ~/.config/calibre/plugins/<name>.zip; that file is
# the convergence marker. Delete it and re-run to pick up a newer release.
calibre_plugins:
  - name: KFX Input
    url: https://plugins.calibre-ebook.com/291290.zip
