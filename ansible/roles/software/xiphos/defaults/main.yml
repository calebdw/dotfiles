---
# Module name -> the remote source that carries it. Everything here is on
# CrossWire.
#
# These are module names, not titles. `installmgr -s` lists the sources and
# `installmgr -rl CrossWire` lists the 400-odd modules that one carries, which
# is how to find the name of anything added here later.
xiphos_modules:
  # King James Version (1769) with Strongs Numbers and Morphology and
  # CatchWords. KJVA is the same text including the Apocrypha, if that is ever
  # wanted instead.
  KJV: CrossWire
  # Scofield Reference Notes, 1917 Edition.
  Scofield: CrossWire
  # Webster's Dictionary 1828, and the 1913 Revised Unabridged. Not to be
  # confused with `Webster`, which is the Webster Bible -- a translation, not a
  # dictionary.
  Webster1828: CrossWire
  Webster1913: CrossWire
  # Strong's numbers: the KJV module above is the Strong's edition, and the
  # lexicon pane is pointed at these in the settings seed.
  StrongsGreek: CrossWire
  StrongsHebrew: CrossWire

# installmgr will not touch the network without this, and this is the whole
# flag -- there is no shorter spelling and no config setting that replaces it.
xiphos_installmgr_internet: '--allow-internet-access-and-risk-tracing-and-jail-or-martyrdom'

# Xiphos only rewrites a layout key that already exists, and it never creates
# these two. Missing, the sidebar falls back to 100 and the bible pane to 0.
# Sized for a tiled 2560x1440 window at 1.25 (~2024 wide).
xiphos_layout:
  shortcutbar: 320
  textpane: 1100
