# Talk to the card through pcscd rather than gpg's built-in CCID driver, which
# otherwise fights with anything else using the YubiKey.
#   https://support.yubico.com/hc/en-us/articles/4819584884124-Resolving-GPG-s-CCID-conflicts
disable-ccid

# pcsc-shared # This prevents the yubikey pin from being cached!!

# No pcsc-driver line: scdaemon finds libpcsclite.so.1 on the linker path.
# Arch keeps it at /usr/lib/libpcsclite.so.1 -- the explicit path this file
# used to carry was Debian's multiarch one and does not exist here, which fails
# as "selecting card failed: Service is not running".

# Always try to use yubikey as the first reader even when other smart card
# readers are connected. The name must match `pcsc_scan` output exactly.
reader-port Yubico YubiKey
